buildscript {
  ext.getLocalWebViewExt = { name, fallback ->
    return rootProject.ext.has(name)
      ? rootProject.ext.get(name)
      : (project.properties["ReactNativeLocalWebView_" + name] ?: fallback)
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getLocalWebViewExt('kotlinVersion', '2.1.20')}"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply from: "../nitrogen/generated/android/reactnativelocalwebview+autolinking.gradle"

android {
  namespace "com.margelo.nitro.localwebview"
  compileSdkVersion getLocalWebViewExt("compileSdkVersion", 35).toInteger()

  defaultConfig {
    minSdkVersion getLocalWebViewExt("minSdkVersion", 24).toInteger()
    targetSdkVersion getLocalWebViewExt("targetSdkVersion", 35).toInteger()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libhermes-executor-debug.so",
      "**/libhermes_executor.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
      "**/libjscexecutor.so",
    ]
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "androidx.webkit:webkit:1.14.0"
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${getLocalWebViewExt('kotlinVersion', '2.1.20')}"
  implementation project(":react-native-nitro-modules")
}
