name: Production Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Full production matrix or a 50 MiB/100-resource smoke run.
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke
      pr_number:
        description: Pull request number to report E2E results to.
        required: false
        type: string
      pr_sha:
        description: Pull request head SHA to test.
        required: false
        type: string
      pr_repository:
        description: Pull request head repository to checkout.
        required: false
        type: string
      comment_id:
        description: Issue comment id to update with E2E progress.
        required: false
        type: string
      requested_by:
        description: GitHub username that requested the run.
        required: false
        type: string

permissions:
  contents: read
  issues: write

env:
  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
  TESTED_REPOSITORY: ${{ inputs.pr_repository || github.repository }}
  TESTED_SHA: ${{ inputs.pr_sha || github.sha }}

concurrency:
  group: production-benchmarks-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Android emulators and iOS simulator
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - mac-mini-e2e
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.pr_repository || github.repository }}
          ref: ${{ inputs.pr_sha || github.ref }}
          persist-credentials: false

      - name: Update E2E progress
        env:
          E2E_SUITE: ${{ inputs.suite }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          scripts/e2e/update-e2e-comment.sh \
            "${{ inputs.comment_id }}" \
            running \
            "Bootstrapping the Mac mini runner"

      - name: Bootstrap benchmark runner
        run: scripts/e2e/bootstrap-runner.sh

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate workspace and build package
        run: |
          yarn nx show projects
          yarn check

      - name: Prepare real Unity fixture
        run: yarn nx run benchmark-e2e:fixture:prepare

      - name: Start tailnet-only HTTPS fixture
        shell: bash
        run: |
          mkdir -p e2e/artifacts
          tailscale serve get-config --all > e2e/artifacts/tailscale-previous.json
          echo "TAILSCALE_SNAPSHOT_CREATED=true" >> "$GITHUB_ENV"
          benchmark_dns="$(tailscale status --json | jq -r '.Self.DNSName' | sed 's/\\.$//')"
          if [ -z "$benchmark_dns" ] || [ "$benchmark_dns" = "null" ]; then
            echo "The benchmark runner is not connected to Tailscale." >&2
            exit 1
          fi
          benchmark_origin="https://${benchmark_dns}:8443"
          echo "BENCHMARK_ORIGIN=$benchmark_origin" >> "$GITHUB_ENV"
          BENCHMARK_PUBLIC_ORIGIN="$benchmark_origin" \
            node e2e/fixture-server.mjs \
            >e2e/artifacts/fixture-server.log 2>&1 &
          echo "FIXTURE_SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/__control/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/__control/health
          tailscale serve --yes --bg --https=8443 http://127.0.0.1:4173
          curl --fail "$benchmark_origin/__control/health"

      - name: Build Android release app
        run: yarn nx run showcase:android:release

      - name: Select iOS simulator
        shell: bash
        run: |
          simulator_udid="$(
            xcrun simctl list devices available |
              awk -F '[()]' '/iPhone/ { print $2; exit }'
          )"
          if [ -z "$simulator_udid" ]; then
            echo "No available iPhone simulator found." >&2
            exit 1
          fi
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          if xcrun simctl list devices booted | grep -q "$simulator_udid"; then
            echo "SIMULATOR_STARTED_BY_WORKFLOW=false" >> "$GITHUB_ENV"
          else
            echo "SIMULATOR_STARTED_BY_WORKFLOW=true" >> "$GITHUB_ENV"
          fi
          xcrun simctl boot "$simulator_udid" || true
          xcrun simctl bootstatus "$simulator_udid" -b

      - name: Install iOS dependencies
        working-directory: examples/showcase
        run: |
          bundle install
          bundle exec pod install --project-directory=ios

      - name: Build iOS simulator release app
        run: yarn nx run showcase:ios:release

      - name: Update benchmark progress
        env:
          E2E_SUITE: ${{ inputs.suite }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          scripts/e2e/update-e2e-comment.sh \
            "${{ inputs.comment_id }}" \
            running \
            "Running Android and iOS benchmark matrices"

      - name: Compare direct and local runtimes on low-end Android
        id: benchmark_low_android
        continue-on-error: true
        run: scripts/e2e/run-comparison-benchmark.sh android-low "${{ inputs.suite }}" "$BENCHMARK_ORIGIN"

      - name: Compare direct and local runtimes on latest Android System WebView
        id: benchmark_latest_android
        continue-on-error: true
        run: scripts/e2e/run-comparison-benchmark.sh android-latest "${{ inputs.suite }}" "$BENCHMARK_ORIGIN"

      - name: Compare direct and local runtimes on iOS simulator
        id: benchmark_ios
        continue-on-error: true
        run: scripts/e2e/run-comparison-benchmark.sh ios "${{ inputs.suite }}" "$BENCHMARK_ORIGIN"

      - name: Assert benchmark verdicts
        if: always()
        env:
          IOS_OUTCOME: ${{ steps.benchmark_ios.outcome }}
          LATEST_ANDROID_OUTCOME: ${{ steps.benchmark_latest_android.outcome }}
          LOW_ANDROID_OUTCOME: ${{ steps.benchmark_low_android.outcome }}
        run: |
          test "$LOW_ANDROID_OUTCOME" = success
          test "$LATEST_ANDROID_OUTCOME" = success
          test "$IOS_OUTCOME" = success

      - name: Publish direct-vs-local comparison
        if: always()
        env:
          COMMENT_ID: ${{ inputs.comment_id }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        shell: bash
        run: |
          comparison="$(find e2e/artifacts -maxdepth 1 -name '*-comparison-*.md' -print -exec cat {} \;)"
          if [ -n "$comparison" ]; then
            printf '%s\n' "$comparison" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then
            body="$(printf '@%s Production E2E benchmark comparison\n\n- Suite: %s\n- Revision: %s@%s\n- Run: %s\n\n%s\n' \
              "$REQUESTED_BY" \
              "${{ inputs.suite }}" \
              "$TESTED_REPOSITORY" \
              "$TESTED_SHA" \
              "$RUN_URL" \
              "${comparison:-No comparison report was produced.}")"
            gh api -X PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -f body="$body" \
              >/dev/null || true
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-benchmarks-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: e2e/artifacts

      - name: Restore runner services
        if: always()
        shell: bash
        run: |
          if [ -n "${FIXTURE_SERVER_PID:-}" ]; then
            kill "$FIXTURE_SERVER_PID" >/dev/null 2>&1 || true
          fi
          if [ "${SIMULATOR_STARTED_BY_WORKFLOW:-}" = true ] && [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          fi
          if [ "${TAILSCALE_SNAPSHOT_CREATED:-}" = true ]; then
            if [ -s e2e/artifacts/tailscale-previous.json ]; then
              tailscale serve set-config --all e2e/artifacts/tailscale-previous.json
            else
              tailscale serve reset
            fi
          fi

  notify-e2e-result:
    name: Notify E2E result
    runs-on: ubuntu-latest
    needs:
      - benchmark
    if: always() && inputs.comment_id != '' && needs.benchmark.result != 'success'

    steps:
      - name: Update final E2E result
        env:
          COMMENT_ID: ${{ inputs.comment_id }}
          E2E_RESULT: ${{ needs.benchmark.result }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          status="$E2E_RESULT"
          if [ "$status" = success ]; then
            status=passed
          fi
          body="$(printf '@%s Production E2E: %s\n\n- Suite: %s\n- Revision: %s@%s\n- Run: %s\n' \
            "$REQUESTED_BY" \
            "$status" \
            "${{ inputs.suite }}" \
            "$TESTED_REPOSITORY" \
            "$TESTED_SHA" \
            "$RUN_URL")"
          gh api -X PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
            -f body="$body"
