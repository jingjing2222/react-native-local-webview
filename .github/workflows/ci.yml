name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: yarn format:check
          - name: Lint
            command: yarn lint
          - name: Types
            command: yarn typecheck
          - name: Unit tests
            command: yarn test:coverage

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn build

      - name: Validate package metadata
        run: yarn publint

      - name: Inspect package contents
        run: yarn workspace react-native-local-webview pack --dry-run
